name: build

# facilities.csv 나 template.html 을 고쳐서 push 하면
# index.html 을 다시 만들어 커밋합니다. 로컬에서 python 을 돌릴 필요가 없습니다.
on:
  push:
    branches: [main]
    paths:
      - "facilities.csv"
      - "template.html"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 페이지 생성
        run: python3 build.py facilities.csv index.html

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.html; then
            echo "변경 없음"
          else
            git add index.html
            git commit -m "rebuild: facilities.csv 반영"
            git push
          fi

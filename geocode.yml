name: 좌표 채우기

# Actions 탭에서 버튼을 눌러 실행합니다. 터미널이 필요 없습니다.
# 실행 전에 Settings > Secrets and variables > Actions 에서
# KAKAO_KEY 라는 이름으로 카카오 REST API 키를 등록해 두세요.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "어떤 행을 다시 찾을까요"
        type: choice
        default: 전체-다시찾기
        options:
          - 전체-다시찾기
          - 비어있는-행만
      engine:
        description: "어떤 지오코더를 쓸까요"
        type: choice
        default: kakao
        options:
          - kakao
          - nominatim

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 카카오 키 확인
        if: inputs.engine == 'kakao'
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$KAKAO_KEY" ]; then
            echo "::error::KAKAO_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에서 등록해 주세요."
            exit 1
          fi

      - name: 기존 좌표 지우기
        if: inputs.mode == '전체-다시찾기'
        run: |
          python3 - <<'PY'
          import csv
          p = "facilities.csv"
          rows = list(csv.DictReader(open(p, encoding="utf-8-sig")))
          cols = list(rows[0].keys())
          for c in ("lat", "lng", "precision", "matched"):
              if c not in cols:
                  cols.append(c)
          for r in rows:
              r["lat"] = r["lng"] = r["precision"] = r["matched"] = ""
          with open(p, "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=cols)
              w.writeheader(); w.writerows(rows)
          print(f"{len(rows)}행의 좌표를 비웠습니다. 전부 다시 찾습니다.")
          PY

      - name: 주소를 좌표로 변환
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ "${{ inputs.engine }}" = "kakao" ]; then
            python3 geocode.py facilities.csv
          else
            python3 geocode_osm.py facilities.csv
          fi

      - name: 결과 요약
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          rows = list(csv.DictReader(open("facilities.csv", encoding="utf-8-sig")))
          def label(r):
              if not (r.get("lat") or "").strip():
                  return "좌표 없음"
              return r.get("precision") or "정확 (주소와 일치)"
          c = Counter(label(r) for r in rows)
          print("── 좌표 상태 ──")
          for k, v in c.most_common():
              print(f"  {k}: {v}개")
          bad = [r for r in rows if (r.get("precision") or "") in ("축약주소", "키워드")]
          if bad:
              print("\n── 확인이 필요한 시설 ──")
              print("원본 주소와 실제로 찍힌 위치를 비교해 보세요.\n")
              for r in bad:
                  print(f"  [{r['precision']}] {r['name']}")
                  print(f"      원본: {r['address']}")
                  print(f"      찍힘: {r.get('matched','')}")
          PY

      - name: 페이지 다시 만들기
        run: python3 build.py facilities.csv index.html

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facilities.csv index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "좌표 갱신 (${{ inputs.engine }} / ${{ inputs.mode }})"
            git push
          fi

name: 좌표 채우기

# Actions 탭에서 버튼을 눌러 실행합니다. 터미널이 필요 없습니다.
# 실행 전에 Settings > Secrets and variables > Actions 에서
# KAKAO_KEY 라는 이름으로 카카오 REST API 키를 등록해 두세요.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "어떤 지오코더를 쓸까요"
        type: choice
        default: kakao
        options:
          - kakao
          - nominatim

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 카카오 키 확인
        if: inputs.engine == 'kakao'
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$KAKAO_KEY" ]; then
            echo "::error::KAKAO_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에서 등록해 주세요."
            exit 1
          fi

      - name: 주소를 좌표로 변환
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ "${{ inputs.engine }}" = "kakao" ]; then
            python3 geocode.py facilities.csv
          else
            python3 geocode_osm.py facilities.csv
          fi

      - name: 페이지 다시 만들기
        run: python3 build.py facilities.csv index.html

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facilities.csv index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "좌표 갱신 (${{ inputs.engine }})"
            git push
          fi
